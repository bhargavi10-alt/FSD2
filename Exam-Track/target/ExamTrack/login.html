
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | ExamTrack</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf1ff, #f8faff);
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 34px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(28, 49, 82, 0.10);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #315ee7;
        }

        h1 {
            margin: 22px 0 8px;
            font-size: 27px;
        }

        p {
            color: #68738a;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 24px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd3e1;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #315ee7;
            box-shadow: 0 0 0 3px rgba(49, 94, 231, 0.12);
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #315ee7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #244bc5;
        }

        button:disabled {
            background: #879be0;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            color: #b42318;
            background: #fff0ee;
            border: 1px solid #ffd0ca;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #effaf2;
            border: 1px solid #b7ebc5;
        }

        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            line-height: 1.8;
        }

        a {
            color: #315ee7;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 8px;
        }

        .hint {
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="card">

        <div class="logo">ExamTrack</div>

        <h1>Welcome back</h1>

        <p>
            Log in with your registered email address and password.
        </p>

        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite">
        </div>

        <form
            id="loginForm"
            action="login"
            method="post">


            <label for="email">Registered email address</label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                maxlength="150"
                required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>

            <button id="submitButton" type="submit">
                Log In
            </button>
        </form>

        <div class="links">
            New to ExamTrack?
            <a href="register.html">Create an account</a>

            <br>

            <a class="back-link" href="index.html">
                Back to Home
            </a>
        </div>

    </main>

    <script>
        const messageBox = document.getElementById("message");
        const loginForm = document.getElementById("loginForm");
        const submitButton = document.getElementById("submitButton");
        const emailInput = document.getElementById("email");

        const errorMessages = {
            email: "Please enter your registered email address.",

            invalid:
                "No account with a usable password was found for this email. Check your email or complete registration.",

            server:
                "A database or server error occurred. Please check the Tomcat logs.",

            "email-send":
                "The OTP email could not be sent. Check your Gmail configuration and the Tomcat logs.",

            expired:
                "Your verification code or session has expired. Please request a new OTP.",

            attempts:
                "Too many incorrect OTP attempts. Please request a new code.",

            session:
                "Your verification session has expired. Please start again.",

            cooldown:
                "Please wait before requesting another OTP."
        };

        function showMessage(text, type = "error") {
            messageBox.textContent = text;
            messageBox.className = "message " + type;
        }

        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");

        if (error && errorMessages[error]) {
            showMessage(errorMessages[error]);
        }

        loginForm.addEventListener("submit", function(event) {
            const email = emailInput.value.trim();

            if (!email) {
                event.preventDefault();
                showMessage("Please enter your registered email address.");
                emailInput.focus();
                return;
            }

            if (email.length > 150) {
                event.preventDefault();
                showMessage("Your email address is too long.");
                emailInput.focus();
                return;
            }

            emailInput.value = email;

            submitButton.disabled = true;
            submitButton.textContent = "Logging in...";

            // The browser submits the form to send-email-otp.
            // The Java servlet handles the database and email operations.
        });

        // Restore the button if the browser returns to this page
        // using its back/forward cache.
        window.addEventListener("pageshow", function() {
            submitButton.disabled = false;
            submitButton.textContent = "Log In";
        });
    </script>
</body>
</html>
