
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify OTP | ExamTrack</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf1ff,#f8faff);color:#172033}
.card{width:100%;max-width:420px;background:white;padding:34px;border-radius:18px;box-shadow:0 12px 40px #1c31521a}
.logo{font-size:25px;font-weight:bold;color:#315ee7}
h1{font-size:27px}
p{color:#68738a;line-height:1.5}
label{display:block;margin:24px 0 8px;font-weight:bold}
input{width:100%;padding:14px;border:1px solid #cbd3e1;border-radius:9px;font-size:22px;letter-spacing:7px;text-align:center}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:9px;background:#315ee7;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.message{color:#b42318;font-size:14px;margin-top:12px}
a{color:#315ee7}
</style>
</head>
<body>
<main class="card">
    <div class="logo">ExamTrack</div>
    <h1>Verify your email</h1>
    <p>Enter the six-digit code sent to your email. It expires in five minutes.</p>

    <div id="message" class="message" role="alert" aria-live="polite"></div>

    <form id="otpForm" method="post">
        <label for="otp">Verification code</label>
        <input id="otp" name="otp" type="text"
               inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" minlength="6" maxlength="6"
               placeholder="000000" required>
        <button type="submit">Verify and continue</button>
    </form>

    <p><a href="register.html">Register</a> · <a href="login.html">Login</a></p>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const flow = params.get("flow");
const error = params.get("error");

const messages = {
    invalid: "Incorrect code. Please check your email and try again.",
    expired: "Your verification code expired. Request a new OTP.",
    attempts: "Too many incorrect attempts. Request a new OTP.",
    cooldown: "Please wait before requesting another OTP.",
    session: "Your verification session expired. Please start again.",
    incomplete: "Please complete registration before logging in."
};

if (messages[error]) {
    document.getElementById("message").textContent = messages[error];
}

if (flow === "register") {
    document.getElementById("otpForm").action = "verify-registration-otp";
} else if (flow === "login") {
    document.getElementById("otpForm").action = "verify-email-otp";
} else {
    document.getElementById("message").textContent =
        "Please start from registration or login to verify your email.";
    document.querySelector("#otpForm button").disabled = true;
}

document.getElementById("otpForm").addEventListener("submit", function(event) {
    if (flow !== "register" && flow !== "login") {
        event.preventDefault();
    }
});
</script>
</body>
</html>
